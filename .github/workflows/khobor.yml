name: khobor
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python khobor.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add index.html data.json
          git commit -m "update" || echo nochange
          git push
